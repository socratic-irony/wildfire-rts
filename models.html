<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Cinderline Model Lab</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #cfdac8;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      }
      #lab {
        position: fixed;
        inset: 0;
      }
      .lab-bar {
        position: fixed;
        top: 10px;
        left: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        max-width: calc(100vw - 20px);
        padding: 8px 10px;
        border-radius: 8px;
        background: rgba(16, 22, 16, 0.82);
        color: #efe4c6;
        font-size: 11px;
      }
      .lab-bar a {
        padding: 3px 7px;
        border: 1px solid rgba(239, 220, 176, 0.25);
        border-radius: 4px;
        color: inherit;
        text-decoration: none;
      }
      .lab-bar a.on {
        border-color: #f1b34d;
        color: #ffd27a;
      }
      .lab-label {
        position: fixed;
        transform: translate(-50%, 0);
        padding: 1px 5px;
        border-radius: 3px;
        background: rgba(16, 22, 16, 0.72);
        color: #efe4c6;
        font-size: 10px;
        white-space: nowrap;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="lab"></div>
    <script type="module" src="/src/tools/modelLab.ts"></script>
  </body>
</html>
